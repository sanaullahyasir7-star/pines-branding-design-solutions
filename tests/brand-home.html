<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pines brand layout review</title><style>body{margin:0;background:#ddd;font:14px/1.4 system-ui}header{padding:10px;background:#efeee5}select,button,label{padding:8px;margin:4px}iframe{border:0;display:block;background:#efeee5}pre{white-space:pre-wrap}</style><header><label>Page<select id="page"><option value="../index.html">Preview</option><option value="../index.html">Live home</option></select></label><label>Width<select id="width"><option>390</option><option>320</option><option>360</option><option>414</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Section<select id="section"><option value="">Top</option><option value="#services">Services</option><option value=".bh-showcase">Showcase</option><option value=".bh-process">Process</option><option value=".bh-reviews">Reviews</option><option value=".bh-contact">Contact</option></select></label><label><input type="checkbox" id="nojs">No JavaScript</label><button id="show">Show</button><button id="run">Run layout checks</button><span role="status" id="status"></span></header><iframe id="view" width="390" height="900" title="Responsive website preview" src="../index.html"></iframe><pre id="results"></pre><script>
const frame=document.querySelector('#view'),status=document.querySelector('#status'),output=document.querySelector('#results');
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const load=async(width,nojs=false)=>{frame.width=width;if(nojs)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');await new Promise(r=>{frame.onload=r;frame.src=document.querySelector('#page').value+'?brandreview='+Date.now()});await frame.contentDocument.fonts.ready;await pause(160);};
document.querySelector('#show').onclick=async()=>{await load(document.querySelector('#width').value,document.querySelector('#nojs').checked);const s=document.querySelector('#section').value;if(s)frame.contentDocument.querySelector(s).scrollIntoView();status.textContent='Ready';};
document.querySelector('#run').onclick=async()=>{const rows=[];const check=(name,pass,detail='')=>{rows.push({name,pass,detail});output.textContent=JSON.stringify(rows,null,2)};status.textContent='Checking';
for(const width of [320,360,390,414,768,1024,1440]){await load(width);const d=frame.contentDocument,w=frame.contentWindow;await Promise.all([...d.images].map(im=>{im.loading='eager';return im.decode().catch(()=>{})}));check(width+' no page overflow',d.documentElement.scrollWidth<=d.documentElement.clientWidth);check(width+' images loaded',[...d.images].every(x=>x.naturalWidth));check(width+' one H1',d.querySelectorAll('h1').length===1);check(width+' all four reviews',d.querySelectorAll('.testimonial-card').length===4);check(width+' heading text fits',[...d.querySelectorAll('main h1,main h2,main h3')].every(x=>x.scrollWidth<=x.clientWidth+1));check(width+' process labels clear',[...d.querySelectorAll('.bh-steps li')].every(x=>x.querySelector('h3').getBoundingClientRect().top>=x.querySelector('span').getBoundingClientRect().bottom));check(width+' service grid',new Set([...d.querySelectorAll('.bh-service')].map(x=>x.getBoundingClientRect().left)).size===(width<=760?2:4));const cs=[...d.querySelectorAll('.testimonial-card')];check(width+' review layout',width<=760?d.querySelector('.testimonial-grid').scrollWidth>d.querySelector('.testimonial-grid').clientWidth:new Set(cs.map(x=>x.getBoundingClientRect().left)).size===(width>1020?4:2));check(width+' equal review heights',new Set(cs.map(x=>Math.round(x.getBoundingClientRect().height))).size===1);}
await load(390);const d=frame.contentDocument;const track=d.querySelector('[data-testimonial-grid]');check('Carousel controls visible',!d.querySelector('[data-review-prev]').hidden&&!d.querySelector('[data-review-next]').hidden);check('Carousel has accessible live status',d.querySelector('[data-review-status]').getAttribute('aria-live')==='polite');check('Swipe and snap are enabled',getComputedStyle(track).overflowX==='auto'&&getComputedStyle(track).scrollSnapType.includes('x'));check('Previous/Next boundaries match initial state',d.querySelector('[data-review-prev]').getAttribute('aria-disabled')==='true'&&d.querySelector('[data-review-next]').getAttribute('aria-disabled')==='false');
await load(390,true);const n=frame.contentDocument;check('No JS: all reviews visible',[...n.querySelectorAll('.testimonial-card')].every(x=>x.getBoundingClientRect().width>0)&&n.querySelector('.testimonial-grid').scrollWidth<=n.querySelector('.testimonial-grid').clientWidth);check('No JS: navigation visible',n.defaultView.getComputedStyle(n.querySelector('.navlinks')).display!=='none');check('No JS: controls hidden',n.querySelector('.bh-review-controls').hidden);status.textContent=`${rows.filter(x=>x.pass).length}/${rows.length} passed`;};
</script></html>
