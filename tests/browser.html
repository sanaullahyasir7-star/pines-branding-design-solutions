<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pines responsive verification</title><style>body{margin:0;font:16px/1.5 system-ui;background:#ddd;color:#13291f}header{padding:12px;background:#efeee5}label,button,select{margin:6px;padding:8px}iframe{display:block;border:0;background:white}pre{white-space:pre-wrap;margin:16px}</style><header><strong>Pines · responsive verification</strong><label>Page <select id="page"><option value="../index.html">Home</option><option value="../work/">Work</option><option value="../start-project/">Project Planner</option><option value="../services/">Services</option></select></label><label>Width <select id="width"><option>1440</option><option>1024</option><option>768</option><option>390</option><option>360</option></select></label><label>Section <select id="section"><option value="">Top</option><option value="#testimonials-title">Testimonials</option><option value="#planner">Planner</option><option value="#enquiry">Enquiry</option></select></label><button id="show">Show view</button><label><input id="nojs" type="checkbox">Disable scripts</label><button id="run">Run checks</button><span id="status" role="status"></span></header><iframe title="Website verification viewport" id="view" width="1440" height="1000" src="../index.html"></iframe><pre id="results"></pre><script>
const frame=document.querySelector('#view'),result=document.querySelector('#results'),status=document.querySelector('#status');
const load=(path,width)=>new Promise(resolve=>{frame.width=width;frame.onload=()=>setTimeout(resolve,300);frame.src=path+'?verification=mobile2';});
document.querySelector('#show').onclick=async()=>{if(document.querySelector('#nojs').checked)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');await load(document.querySelector('#page').value,document.querySelector('#width').value);const hash=document.querySelector('#section').value;if(hash)frame.contentWindow.scrollTo(0,frame.contentDocument.querySelector(hash).offsetTop-80);status.textContent='View ready';};
document.querySelector('#run').onclick=async()=>{
 const rows=[]; const check=(label,ok,detail='')=>{rows.push({label,pass:!!ok,detail});result.textContent=JSON.stringify(rows,null,2);}; status.textContent='Checking…';
 const paths=['../index.html','../services/','../process/','../work/','../about/','../faq/','../start-project/','../contact/','../404.html'];
 for(const width of [360,390,768,1024,1440])for(const path of paths){await load(path,width);const d=frame.contentDocument,w=frame.contentWindow;
 check(`${width} ${path}: no horizontal overflow`,d.documentElement.scrollWidth<=d.documentElement.clientWidth,`${d.documentElement.scrollWidth}/${w.innerWidth}`);
 check(`${width} ${path}: one H1`,d.querySelectorAll('h1').length===1);
 const images=[...d.images];images.forEach(im=>{im.loading='eager'});await Promise.all(images.map(im=>im.decode().catch(()=>{})));check(`${width} ${path}: images load`,images.every(im=>im.naturalWidth>0));
 if(path==='../index.html'){const hero=d.querySelector('.bh-hero-visual img');check(`${width}: hero is prioritized`,hero?.getAttribute('fetchpriority')==='high'&&hero?.getAttribute('decoding')==='async'&&!hero?.hasAttribute('loading'));const cards=[...d.querySelectorAll('.testimonial-card')],rects=cards.map(c=>c.getBoundingClientRect());check(`${width}: four quotes`,cards.length===4);check(`${width}: quote layout`,width<=760 ? d.querySelector('.testimonial-grid').classList.contains('is-carousel') : new Set(rects.map(r=>r.left)).size===(width>1020?4:2));if(width>1020)check(`${width}: equal quote heights`,new Set(rects.map(r=>Math.round(r.height))).size===1);}
 if(path==='../index.html' && width<=760){check(`${width}: process labels clear of numbers`,[...d.querySelectorAll('.bh-steps li')].every(e=>e.querySelector('h3').getBoundingClientRect().top>=e.querySelector('span').getBoundingClientRect().bottom));}
 if(path==='../work/'){check(`${width}: photo overlays absent`,[...d.querySelectorAll('.showcase-photo')].every(el=>w.getComputedStyle(el,'::before').content==='none'));check(`${width}: photos contained`,[...d.querySelectorAll('.showcase-photo img')].every(el=>w.getComputedStyle(el).objectFit==='contain'));}
 }
 await load('../start-project/',390);const d=frame.contentDocument,w=frame.contentWindow,f=d.querySelector('form');
 let externalOpens=0;w.open=()=>{externalOpens++;return null};
 const click=s=>d.querySelector(s).click();const fill=(s,v)=>{const el=d.querySelector(s);el.value=v;el.dispatchEvent(new w.Event('input',{bubbles:true}));};
 click('[type=submit]');check('Required validation',d.querySelectorAll('[aria-invalid=true]').length===3&&d.querySelector('[data-prepared]').hidden);
 fill('#plan-use','Sample QA brief — do not send');fill('#plan-quantity','Not sure');fill('#plan-size','Need guidance');fill('#plan-budget','100–200');fill('#plan-destination','Dubai, UAE');
 check('Destination in summary',d.querySelector('[data-plan-summary]').textContent.includes('Dubai, UAE'));check('Planner updates',d.querySelector('[data-plan-summary]').textContent.includes('100–200 PKR'));
 fill('#name','Verification only');fill('#company','Existing company');click('[data-plan-transfer]');check('Transfer preserves contact details',f.elements.name.value==='Verification only'&&f.elements.company.value==='Existing company');
 click('[type=submit]');check('Message prepared',!d.querySelector('[data-prepared]').hidden);const url=new URL(d.querySelector('[data-whatsapp-link]').href);check('WhatsApp number and encoded content',url.pathname==='/923244485746'&&url.searchParams.get('text').includes('Verification only')&&url.searchParams.get('text').includes('100–200 PKR'));check('WhatsApp brief includes website UTM attribution',url.searchParams.get('text').includes('utm_source=pines_website')&&url.searchParams.get('text').includes('utm_medium=whatsapp')&&url.searchParams.get('text').includes('utm_campaign=project_enquiry'));
 check('No enquiry or popup sent',externalOpens===0);
 const prevent=e=>e.preventDefault();const link=d.querySelector('[data-whatsapp-link]');link.addEventListener('click',prevent);link.click();check('Blocked navigation recovery',d.querySelector('[data-brief-feedback]').textContent.includes('If WhatsApp did not open')&&f.elements.name.value==='Verification only'&&link.href.startsWith('https://wa.me/'));link.removeEventListener('click',prevent);
 let copied='';Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copied=text}}});click('[data-copy-brief]');await new Promise(r=>setTimeout(r,20));check('Copy success',copied.includes('Verification only')&&d.querySelector('[data-brief-feedback]').textContent.includes('copied'));
 Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async()=>{throw Error('denied')}}});click('[data-copy-brief]');await new Promise(r=>setTimeout(r,20));check('Copy failure feedback',d.querySelector('[data-brief-feedback]').textContent.includes('unavailable'));
 let saved;w.URL.createObjectURL=blob=>{saved=blob;return 'blob:verification'};w.URL.revokeObjectURL=()=>{};const originalClick=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(!this.download)originalClick.call(this)};click('[data-download-brief]');check('Download content and honest feedback',(await saved.text()).includes('Verification only')&&d.querySelector('[data-brief-feedback]').textContent.includes('does not send'));w.HTMLAnchorElement.prototype.click=originalClick;
 fill('#details','Edited enquiry details for verification');check('Prepared link updates after editing',new URL(link.href).searchParams.get('text').includes('Edited enquiry details'));
 status.textContent=`Complete: ${rows.filter(r=>r.pass).length}/${rows.length} checks passed`;window.verificationResults=rows;
};
</script></html>
